name: bilifast
description: "BiliFast, a Bilibili client"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5
  flutter: 3.47.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  bili_core:
    path: packages/bili_core
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_windows_video: ^1.0.11
  cupertino_http: ^3.1.0
  objective_c: ^9.5.0
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  fake_async: ^1.3.3
  flutter_lints: ^6.0.0
  pigeon: ^29.0.10
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  fonts:
    - family: MiSans
      fonts:
        - asset: assets/fonts/MiSans-Regular.ttf
