# Signed device build to TestFlight on GitHub Actions. Free and queue-free on a public
# repo. The only workflow (KaiC's call, 2026-10-18): tests run locally (scripts/gate.py), and a
# dry run of this one is the iOS compile check. It runs only when dispatched.
#
# Start it with `python scripts/testflight.py start`, never by hand: that hands main's
# exact head to this workflow and checks the environment first.
#
# The repo is public, so this log and every artifact are public too. Secrets live in
# the `testflight` environment, which only main can use (ios-testflight manual-steps §5),
# and reach only the steps that need them. Never upload the signed IPA, Xcode logs or
# ios/Flutter/Generated.xcconfig, never `set -x`, `flutter -v` or `env`. An upload also publishes an
# unsigned IPA, built apart (the sideload job), as a GitHub release, with the source.json sideloading stores read.
name: TestFlight
run-name: TestFlight ${{ inputs.upload && 'upload' || 'dry run' }} ${{ inputs.sha }}

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Head of main to build"
        required: true
        type: string
      upload:
        description: "Upload to TestFlight (off: sign and check the IPA only)"
        required: true
        type: boolean
        default: false
      create_signing:
        description: "Register the bundle id and create the certificate/profile if missing (renewal only)"
        required: true
        type: boolean
        default: false

concurrency:
  group: testflight
  cancel-in-progress: false

permissions:
  contents: read

# This job holds the signing key: never restore a cache another workflow wrote.
cache-mode: none

env:
  # cli-tools otherwise caches an App Store Connect token in $TMPDIR, where the build's
  # third-party code could read it.
  APP_STORE_CONNECT_DISABLE_JWT_CACHE: "1"
  # The same app record as the Swift BiliFast (KaiC5504/BiliNative), so these builds
  # replace it on the phone and keep its keychain login.
  BUNDLE_ID: com.kaichuan.bilifast
  # App Store Connect → the app → App Information → Apple ID.
  ASC_APP_ID: "6823476667"
  # Must match pubspec.yaml's version. Build numbers count from 1 within each version: iOS needs them unique only
  # per version (the Swift app shipped 0.1.0 (1-8), the first Flutter builds 0.2.0 (100)).
  BUILD_NAME: 1.3.0
  FLUTTER_VERSION: 3.47.7
  # Flutter 3.47.7 with Xcode 26.6 is the pair Kazumi has proven. The image keeps the
  # Xcode_26.6.app path across patch releases, so the build number is checked too.
  XCODE_VERSION: "26.6"
  XCODE_BUILD: 17F113

jobs:
  build:
    name: Signed build
    if: github.ref == 'refs/heads/main'
    runs-on: macos-26
    # About 6 minutes of build, then up to an hour of Apple processing on uploads.
    timeout-minutes: 90
    environment: testflight
    outputs:
      number: ${{ steps.number.outputs.number }}
    steps:
      - name: Build only the checked commit
        env:
          WANT: ${{ inputs.sha }}
        run: |
          if [ "$WANT" != "$GITHUB_SHA" ]; then
            echo "main is at $GITHUB_SHA, not $WANT. Start again on the new head."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Toolchain
        run: |
          xcode="/Applications/Xcode_${XCODE_VERSION}.app"
          if [ ! -d "$xcode" ]; then
            echo "Xcode $XCODE_VERSION isn't on this image any more. Installed:"
            ls -d /Applications/Xcode_*.app
            exit 1
          fi
          sudo xcode-select -s "$xcode"
          if ! xcodebuild -version | grep -q "Build version $XCODE_BUILD"; then
            echo "Xcode_$XCODE_VERSION.app is now $(xcodebuild -version | tr '\n' ' ')"
            exit 1
          fi
          # The iOS engine artifacts and packages download while cli-tools installs.
          (flutter precache --ios && flutter pub get) > "$RUNNER_TEMP/flutter-prep.log" 2>&1 &
          prep=$!
          # cli-tools shells out to `openssl smime`; keep OpenSSL 3 first on PATH.
          if [ -d /opt/homebrew/opt/openssl@3/bin ]; then
            echo /opt/homebrew/opt/openssl@3/bin >> "$GITHUB_PATH"
            export PATH="/opt/homebrew/opt/openssl@3/bin:$PATH"
          fi
          # Homebrew's Python refuses global installs (PEP 668), hence setup-python.
          python -m pip install --quiet --require-hashes -r scripts/testflight-requirements.txt
          if ! wait "$prep"; then
            cat "$RUNNER_TEMP/flutter-prep.log"
            exit 1
          fi
          python - > "$RUNNER_TEMP/toolchain.json" <<'EOF'
          import json, subprocess
          def out(*cmd):
              return subprocess.run(cmd, capture_output=True, text=True).stdout.strip()
          def flutter():
              raw = out("flutter", "--version", "--machine")
              try:
                  return json.loads(raw[raw.index("{"):])
              except ValueError:
                  return raw
          print(json.dumps({
              "macos": out("sw_vers", "-productVersion"),
              "xcode": out("xcodebuild", "-version"),
              "flutter": flutter(),
              "openssl": out("openssl", "version"),
              "cli_tools": out("app-store-connect", "--version"),
          }, indent=1))
          EOF
          cat "$RUNNER_TEMP/toolchain.json"

      - name: Create signing files
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          CERT_KEY_B64: ${{ secrets.CERT_KEY_B64 }}
          # The legal name in the certificate, which cli-tools prints. As a secret it is
          # masked; unset, the public log shows it.
          SIGNING_NAME: ${{ secrets.SIGNING_NAME }}
          CREATE: ${{ inputs.create_signing }}
        run: |
          set -e
          umask 077
          key="$RUNNER_TEMP/cert_key.pem"
          trap 'rm -f "$key"' EXIT
          # Not cli-tools' empty default: with it, anything that copies the keychain
          # file can decrypt the signing key offline.
          KEYCHAIN_PASSWORD=$(openssl rand -hex 16)
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          export KEYCHAIN_PASSWORD
          keychain initialize --password @env:KEYCHAIN_PASSWORD
          # Carried base64 because a PEM pasted into a web form loses its line breaks.
          printf '%s' "$CERT_KEY_B64" | openssl base64 -d -A > "$key"
          # The runner only knows this key in its base64 form.
          grep -v -e '-----' "$key" | while IFS= read -r line; do echo "::add-mask::$line"; done
          p12_password=$(openssl rand -hex 16)
          echo "::add-mask::$p12_password"
          # The Swift builds already made the certificate and App Store profile, so this
          # normally only finds them, and a wrong key fails here instead of minting
          # certificates. create_signing is for a renewal.
          create=""
          if [ "$CREATE" = true ]; then create="--create"; fi
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE $create \
            --certificate-key "@file:$key" \
            --p12-password "$p12_password"
          rm -f "$key"
          keychain add-certificates --certificate-password "$p12_password"
          rm -f "$HOME/Library/Developer/Xcode/UserData/Certificates/"*.p12 \
            "$HOME/Library/MobileDevice/Certificates/"*.p12
          # Lets codesign use the key without a GUI prompt on a headless runner.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" \
            "$(security default-keychain | sed -e 's/^ *"//' -e 's/"$//')" > /dev/null

      - name: Apply signing settings
        run: |
          xcode-project use-profiles \
            --project ios/Runner.xcodeproj \
            --export-options-plist "$RUNNER_TEMP/export_options.plist" \
            --code-signing-setup-verbose-logging

      - name: Pick the build number
        id: number
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          # A new version has no builds yet; anything else non-numeric is an error.
          # For a new app the CLI exits 0 and prints "Did not find latest build ...". Otherwise it
          # logs "Found build number N ..." and then prints N alone on the last line.
          status=0
          output=$(app-store-connect get-latest-testflight-build-number "$ASC_APP_ID" --pre-release-version "$BUILD_NAME" 2>&1) || status=$?
          if echo "$output" | grep -qiE "no build|did not find latest build"; then
            latest=0
          elif [ "$status" -ne 0 ]; then
            echo "$output"; exit 1
          else
            latest=$(printf '%s\n' "$output" | grep -E '^[[:space:]]*[0-9]+[[:space:]]*$' | tail -n 1 | tr -d '[:space:]')
          fi
          case "$latest" in
            ''|*[!0-9]*) echo "App Store Connect gave no build number: '$output'"; exit 1 ;;
          esac
          next=$(( 10#$latest + 1 ))
          echo "latest uploaded build of $BUILD_NAME is $latest; this one is $next"
          echo "BUILD_NUMBER=$next" >> "$GITHUB_ENV"
          echo "number=$next" >> "$GITHUB_OUTPUT"

      - name: Build IPA
        run: |
          flutter build ipa --release \
            --build-name="$BUILD_NAME" \
            --build-number="$BUILD_NUMBER" \
            --export-options-plist="$RUNNER_TEMP/export_options.plist"
          set -- build/ios/ipa/*.ipa
          if [ $# -ne 1 ] || [ ! -f "$1" ]; then
            echo "expected exactly one IPA, found: $*"
            exit 1
          fi
          case "$1" in
            *[!A-Za-z0-9._/-]*) echo "unexpected IPA path: $1"; exit 1 ;;
          esac
          echo "IPA=$GITHUB_WORKSPACE/$1" >> "$GITHUB_ENV"

      - name: Describe the IPA
        run: |
          python scripts/ipa_manifest.py describe "$IPA" --sha "$GITHUB_SHA" \
            --toolchain "$RUNNER_TEMP/toolchain.json" \
            > "$RUNNER_TEMP/testflight-build.json"

      # Public: holds no secrets. overwrite: a rerun of this job would otherwise fail on
      # the existing name.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: testflight-build
          path: ${{ runner.temp }}/testflight-build.json
          retention-days: 90
          if-no-files-found: error
          overwrite: true

      - name: Check the IPA
        run: |
          python scripts/ipa_manifest.py check "$RUNNER_TEMP/testflight-build.json" \
            --bundle-id "$BUNDLE_ID" --build "$BUILD_NUMBER"
          echo "### $BUILD_NAME ($BUILD_NUMBER) from ${GITHUB_SHA:0:8}" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload to TestFlight
        if: inputs.upload
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: app-store-connect publish --path "$IPA"

      # Green means Apple has processed the build; testers can install it minutes later. In this job rather than its
      # own, so cli-tools is already installed and no second runner has to start.
      - name: Wait for Apple to finish processing
        if: inputs.upload
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          deadline=$((SECONDS + 3600))
          misses=0
          while [ "$SECONDS" -lt "$deadline" ]; do
            # macOS has no GNU timeout: perl's alarm stops a hung call after 120 s. NOT_FOUND for the
            # first few minutes is normal. Build numbers repeat across versions, so the version is part of the match.
            if output=$(perl -e 'alarm shift; exec @ARGV' 120 app-store-connect builds list \
                  --app-id "$ASC_APP_ID" --pre-release-version "$BUILD_NAME" --build-version-number "$BUILD_NUMBER" \
                  --json 2> "$RUNNER_TEMP/asc.err") \
                && state=$(printf '%s' "$output" | python -c 'import json,sys; b=json.load(sys.stdin); print(b[0]["attributes"]["processingState"] if b else "NOT_FOUND")'); then
              misses=0
            else
              misses=$((misses + 1))
              state="no answer ($misses)"
              # One failed call is a blip; eight in a row is a broken check, so stop and show why.
              if [ "$misses" -ge 8 ]; then
                tail -n 20 "$RUNNER_TEMP/asc.err"
                exit 1
              fi
            fi
            echo "$(date -u +%H:%M:%S) build $BUILD_NUMBER: $state"
            case "$state" in
              VALID) exit 0 ;;
              FAILED|INVALID) echo "Apple rejected build $BUILD_NUMBER; its email says why."; exit 1 ;;
            esac
            sleep 15
          done
          echo "Still processing after an hour; TestFlight will still show it once Apple is done."
          exit 1

  # An unsigned IPA for sideloading (SideStore, AltStore, Sideloadly or Feather sign it with the user's own Apple ID
  # or certificate). Its own runner without the environment: no secret, certificate or profile (they carry KaiC's legal
  # name) is ever near it, and the signed IPA never leaves the build job. Dry runs build it too, as its check.
  sideload:
    name: Unsigned IPA
    needs: build
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: false

      - name: Toolchain
        run: |
          xcode="/Applications/Xcode_${XCODE_VERSION}.app"
          if [ ! -d "$xcode" ]; then
            echo "Xcode $XCODE_VERSION isn't on this image any more."
            exit 1
          fi
          sudo xcode-select -s "$xcode"
          if ! xcodebuild -version | grep -q "Build version $XCODE_BUILD"; then
            echo "Xcode_$XCODE_VERSION.app is now $(xcodebuild -version | tr '\n' ' ')"
            exit 1
          fi

      - name: Build the unsigned IPA
        env:
          BUILD_NUMBER: ${{ needs.build.outputs.number }}
        run: |
          case "$BUILD_NUMBER" in
            ''|*[!0-9]*) echo "the signed build gave no build number: '$BUILD_NUMBER'"; exit 1 ;;
          esac
          flutter build ios --release --no-codesign \
            --build-name="$BUILD_NAME" \
            --build-number="$BUILD_NUMBER"
          app=build/ios/iphoneos/Runner.app
          if [ ! -d "$app" ]; then
            echo "no $app"
            exit 1
          fi
          if [ -e "$app/embedded.mobileprovision" ]; then
            echo "the unsigned app carries a provisioning profile"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$app" "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$RUNNER_TEMP/BiliFast-$BUILD_NAME-$BUILD_NUMBER.ipa" Payload)

      # The release's source.json shows the deployment target and the usage descriptions iOS asks permissions with,
      # read from the built app so the source can't drift from Info.plist.
      - name: Describe the unsigned app
        env:
          BUILD_NUMBER: ${{ needs.build.outputs.number }}
        run: |
          plutil -convert json -o "$RUNNER_TEMP/info.json" build/ios/iphoneos/Runner.app/Info.plist
          # AltStore and SideStore want the source to declare every key containing UsageDescription, NS or not, so a
          # key the privacy filter below would leave out (or an empty one) fails here instead of going missing.
          unlisted=$(jq -r 'to_entries[] | select(.key | contains("UsageDescription"))
            | select((.key | test("^NS[A-Za-z]+UsageDescription$")) and (.value | type == "string" and length > 0) | not)
            | .key' "$RUNNER_TEMP/info.json")
          if [ -n "$unlisted" ]; then
            echo "usage descriptions source.json would leave out or carry empty: $unlisted"
            exit 1
          fi
          jq '{
            bundleIdentifier: .CFBundleIdentifier,
            version: .CFBundleShortVersionString,
            buildVersion: .CFBundleVersion,
            minOSVersion: .MinimumOSVersion,
            privacy: with_entries(select(.key | test("^NS[A-Za-z]+UsageDescription$")))
          }' "$RUNNER_TEMP/info.json" > "$RUNNER_TEMP/sideload-app.json"
          cat "$RUNNER_TEMP/sideload-app.json"
          if ! jq -e --arg bundle "$BUNDLE_ID" --arg version "$BUILD_NAME" --arg build "$BUILD_NUMBER" \
              '.bundleIdentifier == $bundle and .version == $version and .buildVersion == $build
               and (.minOSVersion | type == "string") and (.privacy | length > 0)' \
              "$RUNNER_TEMP/sideload-app.json" > /dev/null; then
            echo "the unsigned app isn't $BUNDLE_ID $BUILD_NAME ($BUILD_NUMBER) with a target and usage descriptions"
            exit 1
          fi

      # What this build changed, for the release page and the source. It rides the artifact because the release job
      # checks nothing out; testflight.py refuses an upload whose notes are still the last build's.
      - name: Take the release notes
        run: |
          if ! grep -q '[^[:space:]]' docs/release-notes.md; then
            echo "docs/release-notes.md is empty"
            exit 1
          fi
          cp docs/release-notes.md "$RUNNER_TEMP/release-notes.md"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-ipa
          path: |
            ${{ runner.temp }}/BiliFast-*.ipa
            ${{ runner.temp }}/sideload-app.json
            ${{ runner.temp }}/release-notes.md
          retention-days: 7
          if-no-files-found: error
          overwrite: true

  # Publishes the unsigned IPA and source.json once Apple has accepted the same build, named by its TestFlight
  # number. The only job with a write token, and it runs nothing from the repo: inline shell and jq only.
  release:
    name: GitHub release
    needs: [build, sideload]
    if: inputs.upload
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsigned-ipa
          path: ipa

      # AltStore's source format (faq.altstore.io/developers/make-a-source), which SideStore and Feather read too. The
      # app and the README point at releases/latest/download/source.json, so every release carries one by that name.
      - name: Write the source
        env:
          BUILD_NUMBER: ${{ needs.build.outputs.number }}
        run: |
          set -- ipa/*.ipa
          if [ $# -ne 1 ] || [ ! -f "$1" ]; then
            echo "expected exactly one IPA, found: $*"
            exit 1
          fi
          size=$(stat -c %s "$1")
          repo="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          cat > "$RUNNER_TEMP/source.jq" <<'JQ'
          # The input is the sideload job's sideload-app.json; it crossed a job boundary, so it is checked first.
          def fail($why): error("source.json: \($why)");
          if .bundleIdentifier != $bundle then fail("the app is \(.bundleIdentifier), not \($bundle)")
          elif .version != $version or .buildVersion != $build then
            fail("the app is \(.version) (\(.buildVersion)), not \($version) (\($build))")
          elif (.minOSVersion | type == "string" and test("^[0-9]+(\\.[0-9]+)*$")) | not then
            fail("no deployment target")
          elif (.privacy | type == "object" and all(.[]; type == "string" and length > 0)
                and (keys | all(test("^NS[A-Za-z]+UsageDescription$")))) | not then fail("bad usage descriptions")
          elif ($size | type == "number" and . > 0) | not then fail("empty IPA")
          else . end
          | {
            name: "BiliFast",
            identifier: "\($bundle).source",
            subtitle: "BiliFast 的安装和更新",
            iconURL: $icon,
            website: $website,
            tintColor: "#FB7299",
            apps: [{
              name: "BiliFast",
              bundleIdentifier: $bundle,
              developerName: "KaiC",
              subtitle: "还是熟悉的味道，就是快了亿点点。",
              localizedDescription: "从零写的第三方 B 站客户端：界面和官方 App 一样，内置 BTR 下载引擎，视频同时从多个 CDN 节点拉取，播放更快。\n\n非官方的个人项目，与哔哩哔哩无关。",
              iconURL: $icon,
              tintColor: "#FB7299",
              category: "entertainment",
              versions: [{
                version: $version,
                buildVersion: $build,
                date: $date,
                localizedDescription: "\($notes | sub("\\s+$"; ""))\n\n发布页：\($website)/releases/tag/v\($version)-\($build)",
                downloadURL: $url,
                size: $size,
                minOSVersion: .minOSVersion
              }],
              # Unsigned, the app carries no entitlements; the signer adds its own.
              appPermissions: {entitlements: [], privacy: .privacy}
            }],
            news: []
          }
          JQ
          jq --arg bundle "$BUNDLE_ID" \
            --arg version "$BUILD_NAME" \
            --arg build "$BUILD_NUMBER" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg url "$repo/releases/download/v$BUILD_NAME-$BUILD_NUMBER/${1#ipa/}" \
            --argjson size "$size" \
            --arg icon "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/ios/Runner/Assets.xcassets/AppIcon.appiconset/icon-1024.png" \
            --arg website "$repo"             --rawfile notes ipa/release-notes.md \
            -f "$RUNNER_TEMP/source.jq" ipa/sideload-app.json > "$RUNNER_TEMP/source.json"
          cat "$RUNNER_TEMP/source.json"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_NUMBER: ${{ needs.build.outputs.number }}
        run: |
          set -- ipa/*.ipa
          if [ $# -ne 1 ] || [ ! -f "$1" ]; then
            echo "expected exactly one IPA, found: $*"
            exit 1
          fi
          notes="$RUNNER_TEMP/notes.md"
          {
            echo "## 更新内容"
            echo
            cat ipa/release-notes.md
            echo
            echo "## 安装"
            echo
          } > "$notes"
          # The address in backticks: GitHub's autolinker would run a bare one on into the full-width comma after it.
          cat >> "$notes" <<EOF
          未签名的 IPA，用 SideStore、AltStore、Sideloadly 或 Feather 签名后安装。免费 Apple ID 的签名 7 天后过期，到期重签就行，数据不会丢。

          SideStore、AltStore Classic 和 Feather 可以添加源 \`$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/latest/download/source.json\`，之后新版本直接在里面更新。
          EOF
          gh release create "v$BUILD_NAME-$BUILD_NUMBER" "$1" "$RUNNER_TEMP/source.json" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "BiliFast $BUILD_NAME ($BUILD_NUMBER)" \
            --notes-file "$notes" \
            --latest
