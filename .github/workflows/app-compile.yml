# Every push: analyze and tests on Linux, and an unsigned iOS release build on macOS, side by side. No secrets and
# no environment here. It is a backstop: the local gate (scripts/gate.py) runs the same tests before a push, and the
# signed build (testflight.yml) compiles iOS itself, so nothing waits on this run.
name: App compile check

on:
  push:
    paths-ignore:
      - "docs/**"
      - "**.md"
  workflow_dispatch:

concurrency:
  group: app-compile-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.7
  # The pair the signed build uses; see testflight.yml.
  XCODE_VERSION: "26.6"
  XCODE_BUILD: 17F113

jobs:
  checks:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          # The SDK and pub cache. Safe here: this workflow holds no secrets. The signed build never restores a cache.
          cache: true

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      # The same three lanes as the local gate, in parallel.
      - name: Gate
        run: |
          python -m pip install --quiet pyyaml==6.0.3
          python scripts/gate.py --ci

  ios:
    name: iOS build (no codesign)
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          # The SDK and pub cache. Safe here: this workflow holds no secrets. The signed build never restores a cache.
          cache: true

      - name: Build
        run: |
          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"
          flutter build ios --release --no-codesign
